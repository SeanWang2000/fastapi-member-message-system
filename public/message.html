<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言板</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="message-page">
        <header class="message-header">
            <div>
                <p class="eyebrow">MEMBER BOARD</p>
                <h1>留言板</h1>
                <p class="subtitle">分享你的想法，和其他會員交流。</p>
            </div>
            <button class="logout-button" id="logout-button" type="button">登出</button>
        </header>

        <section class="message-composer" aria-labelledby="composer-title">
            <h2 id="composer-title">留下留言</h2>
            <textarea id="content" name="content" rows="4" placeholder="輸入你想分享的內容……"></textarea>
            <button class="message-button" type="button">發布留言</button>
        </section>

        <section class="message-board" aria-labelledby="board-title">
            <div class="section-heading">
                <h2 id="board-title">最新留言</h2>
                <span class="message-count">0 則留言</span>
            </div>
            <div id="board" class="message-list">
                <p class="board-status">載入留言中……</p>
            </div>
        </section>
    </main>

    <script src="/main.js"></script>
</body>
</html>
